services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loanhub-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password1!
    ports:
      - "1433:1433"
    volumes:
      - loanhub-sql-data:/var/opt/mssql
      - ./seed-db.sql:/var/opt/mssql/backup/seed-db.sql
    networks:
      - loanhub-local

  backend:
    build:
      context: ./src/backend/LoanHub.Backend/
      dockerfile: Dockerfile
    container_name: loanhub-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:90
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LoanHubBackend;User Id=sa;Password=Password1!;TrustServerCertificate=True;
    ports:
      - "5000:90"
    networks:
      - loanhub-local
    depends_on:
      - sqlserver

  aggregator:
    build:
      context: ./src/aggregator/LoanHub.Aggregator/
      dockerfile: Dockerfile
    container_name: loanhub-aggregator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:100
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LoanHubAggregator;User Id=sa;Password=Password1!;TrustServerCertificate=True;
      - DefaultBankUrl=http://backend:90
    ports:
      - "6000:100"
    networks:
      - loanhub-local
    depends_on:
      - backend
      - sqlserver

  seed-db:
    image: mcr.microsoft.com/mssql-tools
    container_name: loanhub-seed
    depends_on:
      - sqlserver
    volumes:
      - ./seed-db.sql:/seed-db.sql:ro
    networks:
      - loanhub-local
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        for i in {1..30}; do
          /opt/mssql-tools/bin/sqlcmd -S sqlserver,1433 -U sa -P Password1! -Q "SELECT 1" && break
          echo "Waiting for sqlserver..." && sleep 5
        done
        /opt/mssql-tools/bin/sqlcmd -S sqlserver,1433 -U sa -P Password1! -i /seed-db.sql
    restart: "no"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    container_name: loanhub-frontend
    ports:
      - "8080:80"
    networks:
      - loanhub-local
    depends_on:
      - aggregator

networks:
  loanhub-local:
    driver: bridge

volumes:
  loanhub-sql-data:
