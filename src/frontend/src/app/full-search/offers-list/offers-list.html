@if (calculatedOffers && calculatedOffers.length > 0) {
  @for (calculatedOffer of calculatedOffers; track calculatedOffer.id) {
    <app-calculated-offer
      [calculatedOffer]="calculatedOffer"
      (detailsClicked)="emitDetailsClicked($event)"
    />
  }
} @else {
  @for (offer of offers; track offer.id) {
    <app-offer [offer]="offer" (detailsClicked)="emitDetailsClicked($event)" />
  }
}
