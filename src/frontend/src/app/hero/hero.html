<div class="hero-section">
  <div class="hero-content">
    <h2 class="hero-title">Porównaj oferty kredytowe</h2>
    <p class="hero-description">Wyszukaj i porównaj najlepsze oferty kredytowe z naszego banku oraz od zweryfikowanych partnerów. Szybko, przejrzyście i bezpiecznie.</p>
    <div class="hero-accent" *ngIf="counterData$ | async as counter">
      <span class="hero-accent-icon">
        <mat-icon>group</mat-icon>
      </span>
      <div class="hero-accent-text">
        <div class="hero-accent-row">
          <div class="hero-accent-value">{{ counter.count | number: '1.0-0' }}</div>
          <mat-icon class="hero-accent-check">check_circle</mat-icon>
        </div>
        <div class="hero-accent-label">{{ counter.label }}</div>
      </div>
    </div>
  </div>
</div>
