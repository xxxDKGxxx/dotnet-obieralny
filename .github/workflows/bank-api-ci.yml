name: Backend CI

on:
  push:
    branches: ["develop"]
    paths:
      - "src/backend"
      - ".github/workflows/bank-api-ci.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "src/backend"
      - ".github/workflows/bank-api-ci.yml"

jobs:
  build:
    name: Bank API Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        working-directory: src/backend/LoanHub.Backend
        run: dotnet restore LoanHub.Backend.sln
      - name: Build
        working-directory: src/backend/LoanHub.Backend
        run: dotnet build --no-restore LoanHub.Backend.sln
      - name: Test
        working-directory: src/backend/LoanHub.Backend
        run: dotnet test --no-build --verbosity normal LoanHub.Backend.sln

  editorconfig:
    name: EditorConfig Checker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Check Dotnet Format
        working-directory: src/backend/LoanHub.Backend
        run: dotnet tool install -g dotnet-format
      - name: Run Dotnet Format
        working-directory: src/backend/LoanHub.Backend
        run: dotnet format --severity info --verify-no-changes LoanHub.Backend.sln
