name: Aggregator CD

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - 'src/aggregator/**'
    - '.github/workflows/loanhub-aggregator-AutoDeployTrigger-7b142eb9-c48b-45b9-ac02-e0ef4ce8ae02.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LOANHUBAGGREGATOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LOANHUBAGGREGATOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LOANHUBAGGREGATOR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/aggregator/LoanHub.Aggregator
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.LOANHUBAGGREGATOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LOANHUBAGGREGATOR_REGISTRY_PASSWORD }}
          containerAppName: loanhub-aggregator
          resourceGroup: dotnet-obierak
          imageToBuild: ${{ secrets.LOANHUBAGGREGATOR_REGISTRY_USERNAME }}/loanhub-aggregator:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



