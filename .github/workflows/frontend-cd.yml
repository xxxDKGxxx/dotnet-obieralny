name: Frontend CD

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: [develop]
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend-cd.yml"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LOANHUBFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LOANHUBFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LOANHUBFRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/frontend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.LOANHUBFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LOANHUBFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: loanhub-frontend
          resourceGroup: dotnet-obierak
          imageToBuild: ${{ secrets.LOANHUBFRONTEND_REGISTRY_USERNAME }}/loanhub-frontend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_
