name: Trigger auto deployment for loanhub-bank-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/loanhub-bank-api-AutoDeployTrigger-98427e68-2a41-4f10-bedb-035d31f4e7bc.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LOANHUBBANKAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LOANHUBBANKAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LOANHUBBANKAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/backend/LoanHub.Backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.LOANHUBBANKAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LOANHUBBANKAPI_REGISTRY_PASSWORD }}
          containerAppName: loanhub-bank-api
          resourceGroup: dotnet-obierak
          imageToBuild: xxxdkgxxx/loanhub-bank-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


